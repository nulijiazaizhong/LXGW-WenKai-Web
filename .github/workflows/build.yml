name: Build WebFont

# Validation build only. Automatic build + GitHub Release lives in auto-publish.yml.

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "UPSTREAM_VERSION"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "UPSTREAM_VERSION"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      include_mono:
        description: "Also package LXGW WenKai Mono"
        type: boolean
        default: false
      update_upstream_version:
        description: "Rewrite UPSTREAM_VERSION after successful build"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download upstream fonts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()
          if [ "${{ inputs.update_upstream_version }}" = "true" ] || [ -z "${{ inputs.update_upstream_version }}" ]; then
            ARGS+=(--update-upstream-version)
          fi
          if [ "${{ inputs.include_mono }}" = "true" ]; then
            ARGS+=(--include-mono)
          fi
          python scripts/download.py "${ARGS[@]}"

      - name: Build WOFF2 + CSS + metadata
        run: python scripts/build.py -v

      - name: Test artifacts
        run: python scripts/test.py -v

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxgw-wenkai-webfont-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build"
            echo "- Python: $(python -V)"
            echo "- Upstream file: \`UPSTREAM_VERSION\` = \`$(cat UPSTREAM_VERSION 2>/dev/null || echo '(missing)')\`"
            echo "- dist contents:"
            echo '```'
            ls -la dist || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
