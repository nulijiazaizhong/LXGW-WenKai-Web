[project]
name = "lxgw-wenkai-webfont"
version = "1.0.0"
description = "Auto-updating WOFF2 WebFont packaging for LXGW WenKai (霞鹜文楷), served via GitHub Releases + jsDelivr"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT AND OFL-1.1" }
keywords = ["lxgw", "wenkai", "webfont", "woff2", "font", "cdn", "jsdelivr"]
dependencies = [
    "fonttools>=4.50.0",
    "brotli>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/nulijiazaizhong/LXGW-WenKai-Web"
Upstream = "https://github.com/lxgw/LxgwWenKai"

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
